<!doctype html><meta charset=utf-8>
<!-- Forn folio: the app's Compose setup screens (MainActivity.Page) redrawn at phone size, same copy, type and spacing. -->
<style>
@font-face{font-family:I;src:url(../../app/src/main/res/font/instrument_sans.ttf)}
html,body{margin:0;width:412px;height:892px;background:#fff;font-family:I}
.p{box-sizing:border-box;height:892px;padding:72px 24px 48px;display:flex;flex-direction:column}
h1{margin:0;font-weight:600;font-size:34px;line-height:40px;letter-spacing:.2px;color:#1A1A1A;text-wrap:balance}
p{margin:16px 0 0;font-size:17px;line-height:24px;color:#6B6B6B;text-wrap:pretty}
.sp{flex:1}.b{height:64px;border:1px solid #1A1A1A;border-radius:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;color:#1A1A1A}
</style>
<div class=p id=s></div>
<script>
const S={allow:['Go about your day. Find out tonight.','Forn notices the old places you pass. At 9pm, it tells you the best of them. Your location never leaves your phone.','Allow location'],
enjoy:['Enjoy your day.',"You're all set. So far today: 6 places. Find out what at 9pm.",'']};
const [h,t,b]=S[location.hash.slice(1)];
document.getElementById('s').innerHTML=`<h1>${h}</h1><p>${t}</p><div class=sp></div>`+(b?`<div class=b>${b}</div>`:'');
</script>
