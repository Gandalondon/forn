name: Play build

# The Google Play build (26 Nov): app.getforn, no test tools, London facts only, signed with the Play upload key
# (alias forn). Makes a signed .aab to download from the run's artifacts. It never publishes a release, so
# Obtainium doesn't see it. Run by hand (Actions, Play build, Run workflow) or by pushing to the store-build branch.
# Secrets: UPLOAD_KEYSTORE_B64 and UPLOAD_PASSWORD. Without them it still builds, with a debug key, as a check only.

on:
  workflow_dispatch:
  push:
    branches: [store-build]  # while the Play build is being set up (26 Nov); main stays the Obtainium build

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forn-upload.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/forn-upload.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=forn" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secret set: signed with a debug key. Play will refuse this .aab."
          fi

      - name: Build the Play bundle
        env:
          SIGNING_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:bundleRelease -Pstore --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show what ships
        run: |
          m=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          grep -oE 'package="[^"]+"|targetSdkVersion="[0-9]+"|versionName="[^"]+"|uses-permission android:name="[^"]+"|service android:name="[^"]+"' "$m" | sed 's/^/::notice::/'
          unzip -p app/build/outputs/bundle/release/app-release.aab base/assets/spots.json | python3 -c "import json,sys; print('::notice::spots', len(json.load(sys.stdin)))"

      # A check that Tony's Obtainium build still compiles with the same code (not published from here).
      - name: Check the Obtainium build
        env:
          SIGNING_KEYSTORE_PATH: ''
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Name the bundle
        run: cp app/build/outputs/bundle/release/app-release.aab "Forn-1.0-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: forn-play-${{ github.run_number }}
          path: Forn-1.0-*.aab
