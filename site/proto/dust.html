<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forn: what is dust?</title>
<meta name="robots" content="noindex">
<style>
/* Prototype (22 Nov 2026), branch proto-dust only, never merged: compares two meanings of dust over time.
   A: today's model, dust is a find you said Not for me to. B: no choice, dust is every place you passed that
   didn't make that night's five. Same simulated London routine for both. */
@font-face { font-family: "Instrument Sans"; src: url("/instrument-sans.ttf") format("truetype"); font-weight: 400 700; font-stretch: 75% 100%; }
:root { --ink: #1A1A1A; --font: "Instrument Sans", system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; color: var(--ink); font-family: var(--font); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; left: 24px; right: 24px; top: 24px; z-index: 2; pointer-events: none; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; pointer-events: auto; }
.seg button { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--ink); background: #FFFFFF; color: var(--ink); font: 600 15px/1 var(--font); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.tally { position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 2; margin: 0; font-size: 17px; line-height: 24px; text-wrap: pretty; pointer-events: none; }
.tally b { font-weight: 600; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div class="seg" id="model"><button data-v="a">Dust is Not for me</button><button data-v="b">Dust is passed, not told</button></div>
  <div class="seg" id="span"><button data-v="7">Week</button><button data-v="30">Month</button><button data-v="182">6 months</button><button data-v="365">Year</button></div>
</div>
<p class="tally" id="tally"></p>
<script src="/three.js"></script>
<script>
(() => {
const TAU = Math.PI * 2, R_BALL = 0.12, STEP = 0.48, GAP = 0.34, SPECKS = 160;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

/* ---------- A simulated London routine ---------- */
// Zones: a weekday commute (passed both ways), a lunchtime patch near work, and clusters you visit at weekends.
// Each night: the five best untold places you passed are told, never again. That's the same in both models.
function simulate(days) {
  const r = rng(42), zone = (kind) => ({ kind, score: 6 + Math.floor(r() * 4) + r() * 0.5 });
  const commute = Array.from({ length: 45 }, () => zone('commute'));
  const lunch = Array.from({ length: 15 }, () => zone('lunch'));
  const clusters = Array.from({ length: 40 }, () => Array.from({ length: 8 + Math.floor(r() * 12) }, () => zone('trip')));
  const told = new Set(), out = [];
  for (let d = days - 1; d >= 0; d--) { // oldest first, so places are told in the right order
    const t = new Date(); t.setDate(t.getDate() - d); const wd = t.getDay(), weekday = wd > 0 && wd < 6;
    const passed = [];
    if (weekday) {
      commute.forEach((z, i) => passed.push({ z, h: (r() < 0.5 ? 8 + i / 45 : 18.6 - i / 45) }));
      for (let k = 0; k < 3 + Math.floor(r() * 3); k++) passed.push({ z: lunch[Math.floor(r() * lunch.length)], h: 12.5 + r() });
    } else if (r() < 0.6) {
      const c = clusters[Math.floor(r() * clusters.length)], start = 11 + r() * 2;
      c.forEach((z, i) => passed.push({ z, h: start + i * 0.25 }));
    } else if (r() < 0.5) passed.push({ z: lunch[Math.floor(r() * lunch.length)], h: 10 + r() * 8 });
    // Each place once a day, at its first pass; only places not told before count.
    const seen = new Map(); passed.forEach(p => { if (!told.has(p.z) && (!seen.has(p.z) || seen.get(p.z).h > p.h)) seen.set(p.z, p); });
    const fresh = [...seen.values()].sort((a, b) => b.z.score - a.z.score);
    const tonight = fresh.slice(0, 5), rest = fresh.slice(5);
    tonight.forEach(p => told.add(p.z));
    out.push({ d, tonight: tonight.map(p => ({ h: p.h, kept: r() < 0.7 })), rest: rest.map(p => ({ h: p.h })) });
  }
  return out;
}

/* ---------- Scene (from the app) ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#FFFFFF');
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 4000);
const controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.5; controls.enablePan = false;
const SPH = new THREE.SphereGeometry(1, 32, 24), INK = new THREE.MeshBasicMaterial({ color: 0x1A1A1A });
const DOT = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.beginPath(); x.arc(32, 32, 30, 0, TAU); x.fill(); return new THREE.CanvasTexture(c); })();
const DUST = new THREE.PointsMaterial({ color: 0xC8C8C8, size: 0.022, map: DOT, alphaTest: 0.5 });
const EPOCH = new Date(2025, 11, 29);
function rankOf(d) { const t = new Date(); t.setDate(t.getDate() - d); if (t.getDay() !== 1) return 0; const w = Math.round((t - EPOCH) / 6048e5), m = ((w % 52) + 52) % 52; return m === 0 ? 3 : m % 4 === 0 ? 2 : 1; }
const RING_COL = [0xC8C8C8, 0xA8A8A8, 0x6A6A6A, 0x1A1A1A], RING_W = [0, 0.015, 0.035, 0.08], PERIOD = [1, 7, 28, 364];
const LINE_MAT = RING_COL.map((c, k) => k === 0 ? new THREE.LineDashedMaterial({ color: c, dashSize: 0.03, gapSize: 0.07, transparent: true }) : new THREE.LineBasicMaterial({ color: c, transparent: true }));
const BAND_MAT = RING_COL.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, transparent: true }));
const ringR = d => 0.5 + d * STEP;
// Clock-face angle with a nudge; neighbours fan out a gap apart (simplified from the app).
function angles(R, hours, r) {
  const items = hours.map(h => (((h / 24) * TAU - Math.PI / 2 + (r() - 0.5) * 0.12) % TAU + TAU) % TAU).sort((a, b) => a - b);
  const g = GAP / R;
  if (items.length * g >= TAU) return items.map((_, i) => items[0] + i * TAU / items.length);
  for (let i = 1; i < items.length; i++) if (items[i] - items[i - 1] < g) items[i] = items[i - 1] + g;
  return items;
}
let group = null;
function build(model, span) {
  if (group) { scene.remove(group); group.traverse(o => { if (o.isPoints || o.isLine || (o.isMesh && o.geometry !== SPH)) o.geometry.dispose(); }); }
  group = new THREE.Group(); scene.add(group);
  const sim = simulate(span), r = rng(7);
  let balls = 0, dust = 0; const pts = [];
  for (let d = 0; d < span; d++) {
    const R = ringR(d), rank = rankOf(d), segs = Math.min(1024, Math.max(96, Math.round(R * 6))), p = [];
    for (let i = 0; i <= segs; i++) { const a = i / segs * TAU; p.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R)); }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), LINE_MAT[rank]); if (!rank) line.computeLineDistances(); group.add(line);
    if (rank) { const m = new THREE.Mesh(new THREE.RingGeometry(R - RING_W[rank] / 2, R + RING_W[rank] / 2, segs), BAND_MAT[rank]); m.rotation.x = -Math.PI / 2; group.add(m); }
  }
  sim.forEach(day => {
    const R = ringR(day.d);
    const told = day.tonight, puffs = model === 'b' ? day.rest : [];
    const all = told.map(f => ({ ...f, kind: model === 'a' && !f.kept ? 'dust' : 'ball' })).concat(puffs.map(f => ({ ...f, kind: 'dust' })));
    const th = angles(R, all.map(f => f.h), r);
    all.sort((a, b) => a.h - b.h).forEach((f, i) => {
      const pos = new THREE.Vector3(Math.cos(th[i]) * R, (r() - 0.5) * 0.08, Math.sin(th[i]) * R);
      if (f.kind === 'ball') { const m = new THREE.Mesh(SPH, INK); m.scale.setScalar(R_BALL); m.position.copy(pos); group.add(m); balls++; }
      else { dust++; for (let k = 0; k < SPECKS; k++) { const u = r() * 2 - 1, a = r() * TAU, s = Math.sqrt(1 - u * u), dd = 0.15 + Math.pow(r(), 0.7) * 0.45; pts.push(pos.x + s * Math.cos(a) * dd, pos.y + u * dd, pos.z + s * Math.sin(a) * dd); } }
    });
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); group.add(new THREE.Points(g, DUST));
  const outer = ringR(span - 1) + 1, vf = THREE.MathUtils.degToRad(camera.fov) / 2, fit = Math.min(vf, Math.atan(Math.tan(vf) * camera.aspect));
  const dist = outer * 1.1 / Math.sin(fit);
  camera.position.set(Math.cos(0.6) * Math.cos(0.95) * dist, Math.sin(0.95) * dist, Math.sin(0.6) * Math.cos(0.95) * dist); controls.target.set(0, 0, 0); controls.maxDistance = dist * 2; controls.minDistance = 1.5; controls.update();
  const busy = sim.reduce((n, x) => Math.max(n, model === 'b' ? x.rest.length : 0), 0);
  document.getElementById('tally').innerHTML = `<b>${balls} balls, ${dust} dust.</b> ` + (model === 'a'
    ? 'Dust only where you said Not for me (about 3 in 10).'
    : `Dust is every place you passed that didn't make the five. Busiest day: ${busy} left as dust.`);
}
function lod() {
  const dist = camera.position.distanceTo(controls.target) || 1, ppu = innerHeight / (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  const fade = px => Math.max(0, Math.min(1, (px - 4) / 4));
  for (let k = 0; k < 4; k++) { const a = k === 3 ? 1 : fade(STEP * PERIOD[k] * ppu); LINE_MAT[k].opacity = a; LINE_MAT[k].visible = a > 0.01; BAND_MAT[k].opacity = a; BAND_MAT[k].visible = a > 0.01 && RING_W[k] * ppu * renderer.getPixelRatio() >= 1; }
}
let state = { model: 'b', span: 30 };
function seg(id, key) {
  const el = document.getElementById(id);
  const paint = () => [...el.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v == state[key])));
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = key === 'span' ? +b.dataset.v : b.dataset.v; paint(); build(state.model, state.span); });
  paint();
}
seg('model', 'model'); seg('span', 'span');
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.setViewOffset(innerWidth, innerHeight, 0, -innerHeight * 0.06, innerWidth, innerHeight); camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); build(state.model, state.span); });
resize(); build(state.model, state.span);
(function tick() { requestAnimationFrame(tick); controls.update(); lod(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
