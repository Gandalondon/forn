<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forn</title>
<meta name="description" content="Forn notices the old places you pass, and at 9pm tells you the best of them. Every day adds a ring. A concept by Tony Goff-Yu.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<style>
/* Forn concept page (18 Nov 2026). One screen, no scroll: the app's 3D rings fill it, one big line at a time
   over them. Scroll, swipe and the arrow keys step back and forward (no buttons). Text cuts between steps;
   the camera carries the motion. Instrument Sans and three.js are bundled next to this file. */
@font-face { font-family: "Instrument Sans"; src: url("/instrument-sans.ttf") format("truetype"); font-weight: 400 700; font-stretch: 75% 100%; font-display: block; }
:root { --ink: #1A1A1A; --soft: #3A3A3A; --font: "Instrument Sans", system-ui, sans-serif; --pad: 24px; }
@media (min-width: 900px) { :root { --pad: 32px; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: #FFFFFF; color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; }
body.turning { cursor: grabbing; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* Step 0: the word, filling the screen above the bar at the bottom. */
.mark { position: fixed; inset: 0; padding: var(--pad); /* edge to edge: the credit line only shows on the last step (21 Nov) */ z-index: 2; background: #FFFFFF; }
.mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mark text { font-family: var(--font); font-weight: 600; fill: var(--ink); }
.mark[hidden] { display: none; }
.mark text { visibility: hidden; } .mark.ready text { visibility: visible; } /* no flash of a small FORN before the font loads and fits */

/* Steps: one huge line each, nothing else. Narrow letters on a tall screen keep them big. */
.step { position: fixed; left: var(--pad); right: var(--pad); top: var(--pad); z-index: 3; pointer-events: none; transition: color 400ms ease; }
.step[hidden] { display: none; }
/* Lines are broken by hand, so each line is as big as the screen allows. */
:root { --h: min(15vw, 24vh); }
/* Wide screens (24 Nov): cap so the longest line (you missed.) ends before the 9pm card and clear of the rings. */
@media (min-aspect-ratio: 11/10) { :root { --h: min(10.5vw, 24vh); } }
@media (max-aspect-ratio: 1/1) { :root { --h: min(15vw, 13vh); } }
.step h1, .step h2 { margin: 0; font-weight: 600; font-size: var(--h); line-height: 0.92; letter-spacing: 0.005em; }
/* normal width, as in the app; only the word FORN narrows */
.step .note { margin: 24px 0 0; font-size: 19px; line-height: 26px; color: var(--soft); }
.step .btn { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; height: 64px; padding: 0 32px; margin-top: 32px; border-radius: 999px; background: var(--ink); color: #FFFFFF; font: 600 19px/1 var(--font); text-decoration: none; }
.step .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
body.dark .step { color: #FFFFFF; }

/* At 9pm: an 80% black overlay, the line turns white, and the find sits on it as a plain white card. */
.shade { position: fixed; inset: 0; z-index: 2; background: rgba(26,26,26,0.8); opacity: 0; pointer-events: none; transition: opacity 400ms ease; }
body.dark .shade { opacity: 1; }

/* The 9pm card, as in the app. */
.card { position: fixed; z-index: 4; left: var(--pad); right: var(--pad); bottom: calc(var(--pad) + 40px); max-width: 420px; margin-left: auto; border-radius: 28px; background: #FFFFFF; padding: 32px 28px 28px; }
.card[hidden] { display: none; }
.card { opacity: 0; transition: opacity 500ms ease; }
body.dark .card { opacity: 1; }
.card b { display: block; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: 0.2px; text-wrap: pretty; } /* balance stops past six lines; pretty avoids a lone last word */
.card span { display: block; margin-top: 12px; font-size: 15px; line-height: 20px; color: var(--soft); }
/* 9pm: a plain stack of today's finds, as in the app (solid white, no fade, scale or bounce). Swipe or tap for the
   next; the pips under it show which one. Pips are buttons too. */
.card { cursor: pointer; touch-action: pan-y; user-select: none; }
.card.end { cursor: default; }
.pips { position: fixed; z-index: 4; left: var(--pad); right: var(--pad); bottom: calc(var(--pad) + 8px); max-width: 420px; margin-left: auto; display: flex; gap: 0; justify-content: center; opacity: 0; transition: opacity 500ms ease; }
.pips[hidden] { display: none; }
body.dark .pips { opacity: 1; }
.pips button { width: 24px; height: 24px; padding: 8px; border: 0; background: none; cursor: pointer; }
.pips button i { display: block; width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.32); }
.pips button[aria-current="true"] i { background: #FFFFFF; }
/* The ending: a find from the past, then the city sign-up. Field label sits inside it. */
.join { margin-top: calc(var(--h) * 0.24 + 24px); /* clear of the last line's descenders (24 Nov, Tony: sat beside 'your city?' on desktop) */ max-width: 420px; pointer-events: auto; opacity: 0; transition: opacity 500ms ease; } /* under the heading, like Try it early */
body.dark .join { opacity: 1; }
.join form { display: flex; gap: 8px; }
.join input { flex: 1; min-width: 0; height: 64px; padding: 0 24px; border-radius: 999px; border: 0; background: #FFFFFF; color: var(--ink); font: 500 17px/1 var(--font); }
.join input::placeholder { color: var(--soft); }
.join button { height: 64px; padding: 0 28px; border-radius: 999px; border: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; font: 600 17px/1 var(--font); cursor: pointer; }
.join input:focus-visible, .join button:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }

/* Bottom bar: the credit and Privacy on the left, back and next on the right. */
.bar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--pad) + 24px); padding: 0 var(--pad) var(--pad); align-items: flex-end; display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 5; font-size: 13px; line-height: 18px; color: var(--soft); }
.bar[hidden] { display: none; }
.bar p { margin: 0; }
.bar a { color: var(--ink); font-weight: 500; text-decoration: none; }
.bar .link { color: var(--ink); background: none; border: 0; padding: 0; font: inherit; font-weight: 500; cursor: pointer; }
body.dark .bar, body.dark .bar .link, body.dark .bar a { color: #FFFFFF; }
.bar .link:focus-visible, .bar a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 520px) { .bar { font-size: 12px; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div class="mark" id="mark" role="img" aria-label="Forn">
  <svg id="markSvg" preserveAspectRatio="none" aria-hidden="true"><text id="markText" x="0" y="0">FORN</text></svg>
</div>

<main>
  <section class="step" data-s="1" hidden><h1>You pass<br>history<br>every day.</h1></section>
  <section class="step" data-s="2" hidden><h2>Forn<br>notices it<br>for you.</h2></section>
  <section class="step" data-s="3" hidden><h2>At 9pm,<br>see what<br>you missed.</h2></section>
  <section class="step" data-s="4" hidden><h2>The rest<br>is dust,<br>for now.</h2></section>
  <section class="step" data-s="5" hidden><h2>Every day<br>adds a ring.</h2></section>
  <section class="step" data-s="6" hidden><h2>Grow yours.</h2><p class="note">Coming soon to London.</p><a class="btn" href="mailto:hello@getforn.app?subject=Try%20Forn%20early" target="_blank" rel="noopener">Try it early</a></section>
  <section class="step" data-s="7" hidden><h2>Want it in<br>your city?</h2><div class="join" id="join"><form id="joinForm"><input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Your city" aria-label="Your city"><button type="submit">Tell me</button></form></div></section>
</main>

<div class="shade" aria-hidden="true"></div>
<div class="card" id="card" hidden aria-live="polite" aria-roledescription="card"><b></b><span></span></div>
<div class="pips" id="pips" hidden></div>

<div class="bar" hidden>
  <p>&copy; 2026 Forn<span class="who">, a concept by <a href="https://gandalondon.com" target="_blank" rel="noopener">Tony Goff-Yu</a></span>. <a href="/privacy">Privacy</a></p>
</div>
<p class="sr" aria-live="polite" id="live"></p>


<script src="/three.js"></script>
<script>
(() => {
/* ---------- The word: FORN filling the space it's given ---------- */
// Width before stretch: narrow letters on a tall screen, normal ones on a wide one, then stretch to fit exactly.
const markText = document.getElementById('markText'), markSvg = document.getElementById('markSvg');
function fitMark() {
  const box = document.getElementById('mark').getBoundingClientRect();
  const tall = box.height > box.width;
  const stretch = tall ? '75%' : '100%';
  markText.style.fontStretch = stretch;
  // Tight glyph bounds from a canvas measure, so the letters themselves touch the edges.
  const c = document.createElement('canvas').getContext('2d');
  c.font = `600 200px "Instrument Sans"`;
  try { c.fontStretch = tall ? 'condensed' : 'normal'; } catch (e) {}
  const m = c.measureText(markText.textContent);
  const left = m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight, up = m.actualBoundingBoxAscent, down = m.actualBoundingBoxDescent;
  markText.setAttribute('font-size', '200');
  // Sideways, use the SVG's own measure (the canvas can't always apply the narrow width); up and down, the tight glyph measure.
  let x = -left, w = left + right;
  try { const b = markText.getBBox(); if (b.width) { x = b.x; w = b.width; } } catch (e) {}
  markSvg.setAttribute('viewBox', `${x} ${-up} ${w} ${up + down}`);
}

/* ---------- The rings (from the app) ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#FFFFFF');
// A longer lens (24 Nov, Tony: balls looked stretched at the edges on desktop). Fixed shot distances scale by LENS so framing stays the same.
const FOV = 22, LENS = Math.tan(THREE.MathUtils.degToRad(35) / 2) / Math.tan(THREE.MathUtils.degToRad(FOV) / 2);
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 4000);
const SPH = new THREE.SphereGeometry(1, 40, 28), INK = new THREE.MeshBasicMaterial({ color: 0x1A1A1A });
const R_BALL = 0.12, STEP_W = 0.48, DAYS = 150, PARTS = 420; // same sizes as the app (19 Nov)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
// Today in the centre, older days ripple outwards, as in the app (21 Nov; was newest outside like a real tree).
const ringR = d => 0.5 + d * STEP_W, RT = ringR(DAYS - 1);
const today = new Date();
// Regular rings (19 Nov): every 7th day a week ring (Mondays), every 4th week a thicker one, every 13th of those
// (52 weeks) the year ring. Counted from Monday 29 Dec 2025 (start of 2026's week 1), so the year ring lands at New Year.
const EPOCH = new Date(2025, 11, 29);
function rankOf(d) { const t = new Date(today); t.setDate(t.getDate() - d); if (t.getDay() !== 1) return 0;
  const w = Math.round((t - EPOCH) / 6048e5), m = ((w % 52) + 52) % 52; return m === 0 ? 3 : m % 4 === 0 ? 2 : 1; }
const RING_COL = [0xC8C8C8, 0xA8A8A8, 0x6A6A6A, 0x1A1A1A], RING_W = [0, 0.015, 0.035, 0.08];
// Shared materials, so the level of detail below can fade a whole kind of ring at once.
const TODAY_MAT = new THREE.LineDashedMaterial({ color: 0x8A8A8A, dashSize: 0.03, gapSize: 0.07 });
const LINE_MAT = RING_COL.map((c, k) => k === 0 ? new THREE.LineDashedMaterial({ color: c, dashSize: 0.03, gapSize: 0.07, transparent: true }) : new THREE.LineBasicMaterial({ color: c, transparent: true }));
const BAND_MAT = RING_COL.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, transparent: true }));
const group = new THREE.Group(); scene.add(group);
// One group per day, so the past can arrive ring by ring on step 5. Day 0 is today.
const days = Array.from({ length: DAYS }, () => { const g = new THREE.Group(); group.add(g); return g; });
for (let d = 0; d < DAYS; d++) {
  let rank = rankOf(d);
  const R = ringR(d), segs = Math.min(1024, Math.max(96, Math.round(R * 6))), pts = [];
  for (let i = 0; i <= segs; i++) { const a = i / segs * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R)); }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), rank === 0 ? (d === 0 ? TODAY_MAT : LINE_MAT[0]) : LINE_MAT[rank]);
  if (rank === 0) line.computeLineDistances();
  days[d].add(line);
  if (rank) { const m = new THREE.Mesh(new THREE.RingGeometry(R - RING_W[rank] / 2, R + RING_W[rank] / 2, segs), BAND_MAT[rank]); m.rotation.x = -Math.PI / 2; days[d].add(m); }
}
// Example past: finds on about half the days; every day you went out also leaves dust, the places passed but not told yet.
const r = rng(11);
// Round dust (18 Nov): points draw as squares by default, so each speck uses a small round sprite (same as the app).
const DOT = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.beginPath(); x.arc(32, 32, 30, 0, Math.PI * 2); x.fill(); return new THREE.CanvasTexture(c); })();
// Dust (22 Nov): a place you passed but weren't told about yet leaves a small pinch, not a full burst.
const PINCH = 70, REACH = 0.32;
// The trailer sets window.__DUST so specks survive video compression; the page leaves it at 1.
const DUST_K = window.__DUST || 1;
function dust(pos, settled, into = group, n = PINCH, reach = REACH) {
  const start = new Float32Array(n * 3), end = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u), d = reach * (0.25 + Math.pow(r(), 0.7) * 0.75);
    start.set([pos.x, pos.y, pos.z], i * 3); end.set([pos.x + s * Math.cos(th) * d, pos.y + u * d, pos.z + s * Math.sin(th) * d], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(settled ? end.slice() : start.slice(), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xC8C8C8, size: 0.022 * DUST_K, map: DOT, alphaTest: 0.5 }));
  // Each speck gets its own slow drift, so a fresh burst floats like dust in still air.
  const drift = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) drift.set([r() * Math.PI * 2, 0.25 + r() * 0.5, 0.03 + r() * 0.07, r() * Math.PI * 2], i * 4);
  p.visible = settled; // solid light grey, no opacity: overlapping specks merge into one flat grey (19 Nov)
  into.add(p); return { p, start, end, drift };
}
// Where a ball sits on its ring (from the app, 19 Nov): its angle is the time of day you passed the place, like a
// clock face with midnight at the top, plus a small nudge. Balls close in time fan out a gap apart, keeping order.
const TAU = Math.PI * 2, GAP = 0.34;
function placeDay(R, times, r) {
  const items = times.map(h => ({ th: (((h / 24) * TAU - Math.PI / 2 + (r() - 0.5) * 0.12) % TAU + TAU) % TAU })).sort((a, b) => a.th - b.th);
  const g = GAP / R, n = items.length;
  if (n * g >= TAU) items.forEach((it, i) => { it.th = items[0].th + i * TAU / n; });
  else if (n > 1) {
    let cut = 0, widest = -1;
    for (let i = 0; i < n; i++) { const gap = (i + 1 < n ? items[i + 1].th : items[0].th + TAU) - items[i].th; if (gap > widest) { widest = gap; cut = i + 1; } }
    const seq = items.slice(cut).concat(items.slice(0, cut).map(it => ({ th: it.th + TAU, orig: it })));
    const want = seq.map(it => it.th);
    let blocks = seq.map((_, i) => ({ a: i, b: i }));
    const mid = bl => { let m = 0; for (let i = bl.a; i <= bl.b; i++) m += want[i]; return m / (bl.b - bl.a + 1); };
    const lo = bl => mid(bl) - (bl.b - bl.a) * g / 2, hi = bl => mid(bl) + (bl.b - bl.a) * g / 2;
    for (let merged = true; merged;) {
      merged = false;
      for (let i = 0; i + 1 < blocks.length; i++) if (hi(blocks[i]) + g > lo(blocks[i + 1])) { blocks.splice(i, 2, { a: blocks[i].a, b: blocks[i + 1].b }); merged = true; break; }
    }
    if (blocks.length > 1 && hi(blocks[blocks.length - 1]) + g > lo(blocks[0]) + TAU) blocks = [{ a: 0, b: n - 1 }];
    blocks.forEach(bl => { const s0 = lo(bl); for (let i = bl.a; i <= bl.b; i++) (seq[i].orig || seq[i]).th = s0 + (i - bl.a) * g; });
  }
  return items.map(it => new THREE.Vector3(Math.cos(it.th) * R, 0, Math.sin(it.th) * R));
}
// Example times, as in the app: mostly a morning and an evening commute plus a lunchtime walk, so lanes show.
const exampleHour = () => { const k = r(); return k < 0.4 ? 8 + r() * 1.2 : k < 0.75 ? 17.5 + r() * 1.5 : k < 0.9 ? 12.5 + r() : 7 + r() * 15; };
for (let d = 1; d < DAYS; d++) {
  if (r() > 0.55) continue;
  const n = 1 + Math.floor(r() * 2), times = Array.from({ length: n }, exampleHour);
  placeDay(ringR(d), times, r).forEach(pos => {
    pos.y = (r() - 0.5) * 0.08;
    const m = new THREE.Mesh(SPH, INK.clone()); m.material.transparent = true; m.scale.setScalar(R_BALL); m.position.copy(pos); days[d].add(m);
  });
  const left = Math.floor(r() * 4); // places passed but not told that night
  if (left) placeDay(ringR(d), Array.from({ length: left }, exampleHour), r).forEach(pos => dust(pos, true, days[d]));
}
// Today: three finds on the centre ring, placed by the time they were passed. The first (10:42) is the Waterloo
// card. They start as dust and are uncovered at 9pm.
// window.__TODAY (trailer): today's pass times, chosen so the balls sit on the right of the ring, clear of the words.
const todayBalls = placeDay(ringR(0), window.__TODAY || [8.67, 13.2, 17.9], rng(5)).map(p => { const m = new THREE.Mesh(SPH, window.__VIDEO ? INK.clone() : INK); if (window.__VIDEO) m.material.transparent = true; m.scale.setScalar(R_BALL); m.position.copy(p); group.add(m); return m; });
let passedAt = 0, nineAt = 0, pastAt = 0;
// Today's dust (22 Nov): every place you pass leaves a pinch of dust on today's ring. At 9pm three of them are
// uncovered: their dust pulls together into a ball. The rest stays dust, for now.
const todayDust = todayBalls.map((b, i) => ({ ...dust(b.position.clone(), false), ball: i }))
  .concat([7.6, 9.4, 11.6, 15.4, 16.5, 19.6, 20.4].map(h => { const a = (h / 24) * TAU - Math.PI / 2, R = ringR(0); return dust(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R), false); }));
// Today's three finds, all from reviewed facts, in the order they were passed (one per ball).
const FINDS = [
  { fact: "The world's first cash machine opened at Barclays in Enfield in June 1967. People used a paper voucher bought in advance, and could take out £10 at most.", at: 'Enfield' },
  { fact: "Duck Island in St James's Park was home to the park's bird keeper. In 1894 it was also chosen as a safe spot to defuse terrorist bombs found in Westminster.", at: "St James's Park" },
  { fact: "The roof of the Bomber Command Memorial in Green Park is made from a Halifax bomber that crashed in Belgium in 1944. It was pulled out of a swamp in 1997.", at: 'Green Park' },
];
// The ending zooms into a kept ball from a few weeks back.
const oldBall = (() => { for (let d = 18; d < DAYS; d++) { const m = days[d].children.find(o => o.isMesh && o.geometry === SPH); if (m) return m; } return todayBalls[0]; })();

/* ---------- Camera: where each step looks ---------- */
const focus = todayBalls[0].position.clone(), mid = new THREE.Vector3();
const WHOLE = { target: new THREE.Vector3(), dist: null, elev: 0.95, az: 0.55 };
const SHOTS = {
  0: { target: mid.clone(), dist: 5.5, elev: 1.0, az: 0.6 }, 1: { target: mid.clone(), dist: 5.5, elev: 1.0, az: 0.6 }, 2: { target: mid.clone(), dist: 4.5, elev: 1.0, az: 0.6 },
  3: { target: focus.clone(), dist: 3.6, elev: 0.7, az: 0.6 }, 4: { target: mid.clone(), dist: 4.6, elev: 1.0, az: 0.6 },
  5: { target: mid.clone(), dist: 16, elev: 1.0, az: 0.6 }, 6: { ...WHOLE }, 7: { target: oldBall.position.clone(), dist: 3.6, elev: 0.7, az: 0.6 },
};
let cam = { target: new THREE.Vector3(), dist: 100, elev: 0.95, az: 0.55 }, from = null, to = null, t0 = 0, spin = 0;
function wholeDist() {
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return (RT + 1) * 1.02 / Math.sin(Math.min(vf * freeK, hf));
}
// window.__NEAR (trailer only): brings the close shots (steps 0 to 2 and 4) nearer so today's ring reads bigger.
function shot(s) { if (window.__VIDEO && s === 3) s = 2; if (window.__VIDEO && s === 6) s = 5; // video: no zoom at 9pm, and the huge rings stay for Grow yours (Tony, 20:40)
  const o = SHOTS[s], k = s !== 3 && s <= 4 ? (window.__NEAR || 1) : 1; return { target: o.target.clone(), dist: o.dist != null ? o.dist * LENS * k : wholeDist(), elev: o.elev, az: o.az }; }
function place(c) {
  const ce = Math.cos(c.elev), se = Math.sin(c.elev), a = c.az + spin;
  camera.position.set(c.target.x + Math.cos(a) * ce * c.dist, c.target.y + se * c.dist, c.target.z + Math.sin(a) * ce * c.dist);
  camera.lookAt(c.target);
}
// The rings sit in the space the text leaves: below it on a phone, to the right of it on a wide screen.
let freeK = 1, area = { x: 0, y: 0, w: 1, h: 1 };
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  // Phones: the rings fill the screen and run under the words (Tony, 18 Nov: no box, overlap is fine).
  let low = 0;
  steps.forEach(x => { if (+x.dataset.s === 3 || +x.dataset.s === 7) return; const was = x.hidden; x.hidden = false; low = Math.max(low, x.getBoundingClientRect().bottom); x.hidden = was; });
  const top = Math.round(low + 32), bottom = Math.round(document.querySelector('.bar').getBoundingClientRect().height);
  if (w > h * 1.1) { // wide: the words fill the screen, so the rings sit low and right behind them as before

addEventListener('resize', resize);

/* ---------- Steps ---------- */
const steps = [...document.querySelectorAll('.step')], last = 7, WIDE = 6;
let step = 0, lock = 0, darkT = 0;

  document.getElementById('card').hidden = step !== 3; document.getElementById('pips').hidden = step !== 3;
  if (step === 3) showFind(0, false);

  document.body.classList.remove('dark');

  if (step === 3 || step === 7) { const at = step; darkT = setTimeout(() => { if (step === at) document.body.classList.add('dark'); }, reduce ? 0 : 1700); }

  if (step >= 1 && prev < 1) passedAt = performance.now(); // places passed: dust appears

addEventListener('keydown', e => {

  const fwd = ['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key), back = ['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key);

});
// Scroll and swipe step too: one step per gesture.
addEventListener('wheel', e => {

  if (performance.now() - lock < 900 || Math.abs(e.deltaY) + Math.abs(e.deltaX) < 12) return;

let tx = null, ty = null;

  if (tx == null) return;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;

  go(step + ((Math.abs(dy) > Math.abs(dx) ? -dy : -dx) > 0 ? 1 : -1));

/* ---------- Last step: drag sideways to turn the tree (no zoom, no tilt) ---------- */
let dragX = null, vel = 0, turnedAt = 0;
addEventListener('pointerdown', e => {
  if (step !== WIDE || e.target.closest('a, button')) return;
  dragX = e.clientX; vel = 0; document.body.classList.add('turning');
});
addEventListener('pointermove', e => {
  if (dragX == null) return;
  const d = (e.clientX - dragX) * 0.008; dragX = e.clientX; spin += d; vel = d / 0.016; turnedAt = performance.now();

const endDrag = () => { if (dragX == null) return; dragX = null; document.body.classList.remove('turning'); };
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

/* ---------- 9pm cards: swipe or tap through today's finds; the rings glide to each ball ---------- */
const cardEl = document.getElementById('card'), pipsEl = document.getElementById('pips');
let find = 0;
pipsEl.innerHTML = FINDS.map((_, i) => `<button type="button" aria-label="Find ${i + 1} of ${FINDS.length}"><i></i></button>`).join('');
if (window.__VIDEO) window.__find = i => showFind(i, false); // trailer: flick through the finds without moving the camera
function showFind(i, glide = true) {
  find = (i + FINDS.length) % FINDS.length;
  cardEl.querySelector('b').textContent = FINDS[find].fact.replace(/-/g, '\u2011'); /* hyphenated words never break */ cardEl.querySelector('span').textContent = FINDS[find].at;
  [...pipsEl.children].forEach((b, k) => b.setAttribute('aria-current', k === find));
  if (glide && step === 3) { from = { ...cam, target: cam.target.clone() }; to = { ...shot(3), target: todayBalls[find].position.clone() }; t0 = performance.now(); if (reduce) { cam = to; to = null; } }
}
function lockCard() {
  const was = cardEl.hidden; cardEl.hidden = false; cardEl.style.minHeight = '';
  let tallest = 0; const b = cardEl.querySelector('b'), sp = cardEl.querySelector('span');
  FINDS.forEach(f => { b.textContent = f.fact.replace(/-/g, '\u2011'); sp.textContent = f.at; tallest = Math.max(tallest, cardEl.offsetHeight); });
  cardEl.style.minHeight = tallest + 'px'; showFind(find, false); cardEl.hidden = was;
}
document.fonts.ready.then(lockCard); addEventListener('resize', lockCard);
pipsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) showFind([...pipsEl.children].indexOf(b)); });
cardEl.addEventListener('click', () => { if (!swiped) showFind(find + 1); swiped = false; });
let cx = null, cy = 0, swiped = false;
cardEl.addEventListener('touchstart', e => { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.stopPropagation(); }, { passive: true });
cardEl.addEventListener('touchend', e => {
  e.stopPropagation(); if (cx == null) return;
  const dx = e.changedTouches[0].clientX - cx, dy = e.changedTouches[0].clientY - cy; cx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; showFind(find + (dx < 0 ? 1 : -1)); }
  else if (Math.abs(dy) > 40) go(step + (dy < 0 ? 1 : -1)); // an upward swipe on the card still moves the page on
});
document.getElementById('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const city = document.getElementById('city').value.trim() || 'London';
  location.href = `mailto:hello@getforn.app?subject=${encodeURIComponent('Forn in ' + city)}&body=${encodeURIComponent('Tell me when Forn comes to ' + city + '.')}`;
});
['touchstart', 'touchend', 'pointerdown'].forEach(t => document.getElementById('join').addEventListener(t, e => e.stopPropagation(), { passive: true }));

/* Privacy is its own page now (/privacy, 24 Nov). */

/* ---------- Loop ---------- */
// Level of detail (18 Nov, after Tony saw a shimmer zoomed out on his phone): rings packed closer than a few
// pixels beat against the screen's pixel grid (moire). So fine rings fade as they crowd: days first, then Mondays.
// Bands thinner than a pixel hide and leave their hairline, which always draws at one pixel.
const PERIOD = [1, 7, 28, 364];
function lod() {
  const ppu = area.h / (2 * cam.dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); // CSS px per unit at the focus
  const fade = px => Math.max(0, Math.min(1, (px - 4) / 4)); // gone under 4px apart, full from 8px
  for (let k = 0; k < 4; k++) {
    const a = k === 3 ? 1 : fade(STEP_W * PERIOD[k] * ppu);
    LINE_MAT[k].opacity = a; LINE_MAT[k].visible = a > 0.01;
    BAND_MAT[k].opacity = a; BAND_MAT[k].visible = a > 0.01 && RING_W[k] * ppu * renderer.getPixelRatio() >= 1;
  }
}
const ease = k => k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2; // a slow start and a soft landing
let lastT = performance.now(), vo = (window.__WIDE || [-0.3, -0.2]).slice();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  // Let go and it carries on a little, then the slow turn takes over again.
  if (dragX == null && vel) { spin += vel * dt; vel *= Math.pow(0.04, dt); if (Math.abs(vel) < 0.02) vel = 0; }
  // window.__VIDEO (trailer, 24 Nov): everything keeps turning slowly on every step; the page will follow once it's right.
  const VID = window.__VIDEO;
  if (!reduce && dragX == null && !vel) spin += dt * (VID ? 0.06 : 0.05); // the slow turn, on every step (24 Nov: always moving)
  if (VID) {
    // Video framing (24 Nov): steps 1 to 4 share one shot (no zoom at 9pm, nothing jumps); on 5 and 6 the camera holds
    // close with today low right, as on the site, and the rings grow out past the edges. The offset glides between them.
    const tx = step >= 5 ? -0.3 : (window.__WIDE || [0, 0])[0], ty = step >= 5 ? -0.2 : (window.__WIDE || [0, 0])[1], q = Math.min(1, dt * 1.5);
    vo[0] += (tx - vo[0]) * q; vo[1] += (ty - vo[1]) * q;
    if (innerWidth > innerHeight * 1.1) { camera.setViewOffset(innerWidth, innerHeight, innerWidth * vo[0], innerHeight * vo[1], innerWidth, innerHeight); camera.updateProjectionMatrix(); }
  }
  if (to) {
    const k = Math.min(1, (now - t0) / 2200), e = ease(k);
    cam = { target: from.target.clone().lerp(to.target, e), dist: from.dist * Math.pow(to.dist / from.dist, e), elev: from.elev + (to.elev - from.elev) * e, az: from.az + (to.az - from.az) * e };
    if (k >= 1) to = null;
  }
  // Dust appears place by place on step 1; on step 2 the uncovered ones pull together into balls, one after another.
  const open = step < 1 ? 0 : reduce ? 9 : (now - passedAt) / 1000;
  const geOf = i => { const g = step < 2 ? 0 : reduce ? 1 : Math.max(0, Math.min(1, ((now - nineAt) / 1000 - 0.5 - i * 0.7) / 0.4)); return g * g * (3 - 2 * g); }; // balls ease in where they are (24 Nov)
  todayDust.forEach((burst, n) => {

    const a = burst.p.geometry.attributes.position.array, dr = burst.drift, f = e;

      a[i] = burst.start[i] + (burst.end[i] - burst.start[i]) * e + Math.sin(secs * sp + ph) * amp;
      a[i + 1] = burst.start[i + 1] + (burst.end[i + 1] - burst.start[i + 1]) * e + Math.sin(secs * sp * 0.8 + ph2) * amp;
      a[i + 2] = burst.start[i + 2] + (burst.end[i + 2] - burst.start[i + 2]) * e + Math.cos(secs * sp * 0.9 + ph) * amp;

  // Every day adds a ring: from today in the centre, the days before it ripple outwards one by one, going back in time.
  // Slow at first, so the first rings read one by one, then quicker. Only step 6 pulls out to see it all.
  // Every day adds a ring: from today in the centre, the days before it appear outwards one after another, going
  // back in time. Slow at first, so the first rings read one by one, then quicker. Only step 6 pulls out to see it all.
  // Each ring arrives with its balls already on it (Tony, 24 Nov): they appear, they don't grow or fly in.
  const gk = step < 5 ? 0 : step > 5 || reduce ? 1 : Math.max(0, Math.min(1, (now - pastAt) / (VID ? 4800 : 6000))), shown = 1 + Math.floor((DAYS - 1) * ease(gk)); // slow in, quick, slow out
  days.forEach((g, d) => { g.visible = d < shown;  });
  if (step >= 5) {
    // Balls never sit on the words (Tony, 20:33): a past ball fades out while it passes behind a line of the heading.
    const h = steps.find(x => !x.hidden)?.querySelector('h1,h2'), rg = document.createRange(); let rects = [];
    if (h) { rg.selectNodeContents(h); rects = [...rg.getClientRects()]; }
    const v = new THREE.Vector3(), pad = 14, q = Math.min(1, dt * 8);
    days.forEach((g, d) => { if (!d || !g.visible) return; g.children.forEach(o => { if (!(o.isMesh && o.geometry === SPH)) return;
      o.getWorldPosition(v).project(camera); const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight;
      const hit = rects.some(r => x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad);
      o.material.opacity += ((hit ? 0 : 1) - o.material.opacity) * q; }); });
  }
  if (VID) window.__xy = () => todayBalls.map(b => { const v = b.getWorldPosition(new THREE.Vector3()).project(camera); return [Math.round((v.x + 1) / 2 * innerWidth), Math.round((1 - v.y) / 2 * innerHeight), b.visible]; });
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.setScissor(0, 0, innerWidth, innerHeight); renderer.clear();
  renderer.setViewport(area.x, area.y, area.w, area.h); renderer.setScissor(area.x, area.y, area.w, area.h);
  place(cam); lod(); renderer.render(scene, camera);
}
const ready = () => document.getElementById('mark').classList.add('ready');
document.fonts.load('600 200px "Instrument Sans"').then(() => { resize(); cam = shot(0); ready(); }).catch(() => { resize(); ready(); });
setTimeout(() => { resize(); ready(); }, 3000); // never leave the mark hidden
resize(); cam = shot(0);
requestAnimationFrame(tick);
})();
